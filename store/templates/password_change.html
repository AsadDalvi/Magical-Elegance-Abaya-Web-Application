{% extends 'base.html' %}
{% load static %}

{% block content %}
<div class="password-change-section">
    <h1 class="password-change-title">Change Your Password</h1>

    <form method="post" class="password-change-form">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit" class="password-btn">Change Password</button>
    </form>

    <a href="{% url 'profile' %}" class="password-back-link">← Back to Profile</a>
</div>
{% endblock %}

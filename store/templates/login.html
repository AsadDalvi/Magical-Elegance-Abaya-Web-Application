{% extends 'base.html' %}
{% load static %}

{% block content %}
<section class="auth-section">
    <h2>Log into Magical Elegance</h2>
    <form method="post" class="auth-form">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit" class="btn">Login</button>
    </form>

    <p class="auth-alt">
        Don't have an account? <a href="{% url 'register' %}">Register here</a>
    </p>
</section>
{% endblock %}

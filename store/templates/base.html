{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Magical Elegance</title>
    
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    
    <!-- Custom CSS -->
    <link rel="stylesheet" href="{% static 'store/css/style.css' %}">

    <!-- Google Font -->
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500&display=swap" rel="stylesheet">

    <!-- Bootstrap 5 JS Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</head>
<body>

    <!-- Sidebar Toggle -->
    <button class="side-toggle" onclick="document.querySelector('aside').classList.toggle('open')">☰ Menu</button>

    <!-- Sidebar -->
    <aside>
        <a href="{% url 'home' %}">Home</a>
        <a href="{% url 'product_list' %}">Products</a>
        {% if user.is_authenticated %}
            <a href="{% url 'profile' %}">Profile</a>
            <form method="post" action="{% url 'logout' %}">
                {% csrf_token %}
                <button type="submit" class="logout-btn">Logout</button>
            </form>
        {% else %}
            <a href="{% url 'login' %}">Login</a>
            <a href="{% url 'register' %}">Register</a>
        {% endif %}
    </aside>

    <!-- Header -->
    <header>
        <a href="{% url 'home' %}" class="logo">
            <img src="{% static 'store/images/logo.jpeg' %}" alt="Magical Elegance Logo">
            <span>Magical Elegance</span>
        </a>
    </header>

    <!-- Main Content -->
    <main>
        {% block content %}
        {% endblock %}
    </main>

    <!-- Footer -->
    <footer>
        <div class="footer-links">
            <a href="https://instagram.com/magical.elegance" target="_blank">Instagram</a>
            <a href="{% url 'login' %}">Login</a>
            <a href="{% url 'register' %}">Register</a>
        </div>
        <p class="footer-copy">&copy; {% now "Y" %} Magical Elegance. All rights reserved.</p>
    </footer>

</body>
</html>
